
{{- if eq .Values.ingress.route "true" }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: "{{ .Values.template.name}}-route"
  labels:
    app: {{ .Values.template.app }}
spec:
  host: {{ .Values.ingress.host }}
  to:
    kind: Service
    name: {{ .Values.template.name }}
    weight: 100
  port:
    targetPort: {{ .Values.template.port }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
